openapi: 3.0.3

info:
  title: Xoxoday Rewards Platform API
  version: "1.2"
  description: |
    Xoxoday's developer platform for embedding rich reward experiences.
    All data operations are dispatched via `POST /v1/oauth/api` — the `query`
    field in the request body selects which operation runs.

servers:
  - url: https://stagingstores.xoxoday.com/chef
    description: Sandbox
  - url: https://accounts.xoxoday.com/chef
    description: Production
  - url: https://canvas.xoxoday.com/chef
    description: Production – Reward Link (sendLinks only)

security:
  - BearerAuth: []

tags:
  - name: Authentication
  - name: Giftcard API
  - name: Lounge API
  - name: Airmiles API
  - name: Charity API
  - name: Merchandise API
  - name: Mobile Top Up API
  - name: Perks API
  - name: Reward Link API
  - name: Reward Points API
  - name: Storefront Integration API

# ─── Reusable Components ─────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <access_token>`"

  schemas:

    # ── Auth ──────────────────────────────────────────────────────────────────
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: Token lifetime in seconds }
        refresh_token: { type: string }
        access_token_expiry: { type: string, description: Epoch ms }
        refresh_token_expiry: { type: string, description: Epoch ms }

    # ── Shared request wrapper ─────────────────────────────────────────────────
    PlumProTag:
      type: object
      required: [query, tag, variables]
      properties:
        query:
          type: string
          description: "Always use the value shown in the default."
        tag:
          type: string
          default: plumProAPI
          description: "Please use 'plumProAPI' always in tag."
        variables:
          type: object
          required: [data]
          properties:
            data:
              type: object

    # ── Shared variable data schemas ───────────────────────────────────────────
    FiltersData:
      type: object
      properties:
        filterGroupCode:
          type: string
          description: Filter category name representing a specific filter group applied.
        includeFilters:
          type: string
          description: Filters that should be explicitly included.
        excludeFilters:
          type: string
          description: Filters that should be explicitly excluded.

    VouchersData:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results to return per page (pagination).
        page:
          type: integer
          description: Page number to fetch.
        includeProducts:
          type: string
          description: Comma-separated product IDs to include.
        excludeProducts:
          type: string
          description: Comma-separated product IDs to exclude.
        exchangeRate:
          type: integer
          description: Pass 1 to include exchange rate in response.
        sort:
          type: object
          properties:
            field: { type: string, example: name }
            order: { type: string, enum: [ASC, DESC] }
        filters:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: country }
              value: { type: string, example: IN }

    PlaceOrderData:
      type: object
      required: [productId, quantity, denomination, email, poNumber]
      properties:
        productId: { type: string, description: Unique ID of the product. }
        quantity: { type: string, description: Number of units. }
        denomination: { type: string, description: Value of the voucher/reward. }
        email: { type: string, format: email, description: Recipient email. }
        contact: { type: string, description: Recipient contact number. }
        poNumber:
          type: string
          description: Unique Purchase Order number. Must be unique per order.
        tag: { type: string, description: Custom tag to categorise the order. }
        notifyAdminEmail: { type: integer, enum: [0, 1], description: "1 = notify admin." }
        notifyReceiverEmail: { type: integer, enum: [0, 1], description: "1 = notify recipient." }

    OrderDetailsData:
      type: object
      properties:
        poNumber: { type: string, description: Purchase Order number. }
        orderId:
          description: Unique order ID (integer or string).
          oneOf: [{ type: integer }, { type: string }]
        sendMailToReceiver: { type: integer, enum: [0, 1] }

    OrderHistoryData:
      type: object
      properties:
        startDate: { type: string, description: Start date filter (YYYY-MM-DD). }
        endDate: { type: string, description: End date filter (YYYY-MM-DD). }
        limit: { type: integer }
        page: { type: integer }
        tag: { type: string, description: Custom tag filter. }

    # ── Shared response schemas ────────────────────────────────────────────────
    FiltersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getFilters:
              type: object
              properties:
                status: { type: number, description: "1 = success." }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      filterGroupName: { type: string }
                      filterGroupDescription: { type: string }
                      filterGroupCode: { type: string }
                      filters:
                        type: array
                        items:
                          type: object
                          properties:
                            filterValue: { type: string }
                            isoCode: { type: string }
                            filterValueCode: { type: string }

    VouchersResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getVouchers:
              type: object
              properties:
                status: { type: number }
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/VoucherProduct'

    VoucherProduct:
      type: object
      properties:
        productId: { type: integer }
        name: { type: string }
        description: { type: string }
        orderQuantityLimit: { type: integer }
        termsAndConditionsInstructions: { type: string }
        categories: { type: string }
        imageUrl: { type: string }
        currencyCode: { type: string }
        currencyName: { type: string }
        countryName: { type: string }
        countryCode: { type: string }
        valueType: { type: string, enum: [fixed_denomination, open_value] }
        maxValue: { type: number }
        minValue: { type: number }
        valueDenominations: { type: string }
        tatInDays: { type: string }
        usageType: { type: string, enum: [online, offline, both] }
        deliveryType: { type: string, enum: [realtime, delayed] }
        fee: { type: number }
        discount: { type: number }
        exchangeRate: { type: number }
        isPhoneNumberMandatory: { type: boolean }
        isRecommended: { type: integer }

    BalanceResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getBalance:
              type: object
              properties:
                status: { type: number }
                data:
                  type: object
                  properties:
                    value: { type: number, description: Available wallet balance. }
                    currency: { type: string, example: USD }

    PlaceOrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            placeOrder:
              type: object
              properties:
                status: { type: number }
                data:
                  type: object
                  properties:
                    orderId: { type: integer }
                    orderTotal: { type: number }
                    rawOrderTotal: { type: number }
                    orderDiscount: { type: string }
                    discountPercent: { type: string }
                    currencyCode: { type: string }
                    currencyValue: { type: number }
                    amountCharged: { type: number }
                    orderStatus: { type: string, example: complete }
                    deliveryStatus: { type: string, example: delivered }
                    tag: { type: string }
                    quantity: { type: integer }
                    vouchers:
                      type: array
                      items:
                        type: object
                        properties:
                          productId: { type: integer }
                          orderId: { type: integer }
                          voucherCode: { type: string }
                          pin: { type: string }
                          validity: { type: string }
                          amount: { type: number }
                          currency: { type: string }
                          country: { type: string }
                          type: { type: string, enum: [code, codePin, url, urlPin] }
                          currencyValue: { type: number }
                    voucherDetails:
                      type: array
                      items:
                        type: object
                        properties:
                          orderId: { type: integer }
                          productId: { type: integer }
                          productName: { type: string }
                          currencyCode: { type: string }
                          productStatus: { type: string }
                          denomination: { type: number }

    OrderDetailsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getOrderDetails:
              type: object
              properties:
                status: { type: number }
                data:
                  type: object
                  properties:
                    orderId: { type: integer }
                    orderTotal: { type: number }
                    rawOrderTotal: { type: number }
                    orderDiscount: { type: string }
                    discountPercent: { type: string }
                    currencyCode: { type: string }
                    currencyValue: { type: number }
                    amountCharged: { type: number }
                    orderStatus: { type: string }
                    deliveryStatus: { type: string }
                    tag: { type: string }
                    orderDate: { type: string }
                    deliveryDate: { type: string }
                    quantity: { type: integer }
                    vouchers:
                      type: array
                      items:
                        type: object
                        properties:
                          productId: { type: integer }
                          voucherCode: { type: string }
                          pin: { type: string }
                          validity: { type: string }
                          amount: { type: number }
                          currency: { type: string }
                          type: { type: string }
                    voucherDetails:
                      type: array
                      items:
                        type: object
                        properties:
                          orderId: { type: integer }
                          productId: { type: integer }
                          productName: { type: string }
                          currencyCode: { type: string }
                          productStatus: { type: string }
                          denomination: { type: number }

    OrderHistoryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getOrderHistory:
              type: object
              properties:
                status: { type: number }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      orderId: { type: integer }
                      orderDate: { type: string }
                      email: { type: string }
                      deliveryStatus: { type: string }
                      poNumber: { type: string }
                      tag: { type: string, nullable: true }
                      orderTotal: { type: number }
                      amountCharged: { type: number }
                      currencyCode: { type: string }
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            productId: { type: integer }
                            productName: { type: string }
                            receiverEmail: { type: string }
                            price: { type: number }
                            quantity: { type: integer }
                            orderProductStatus: { type: string }
                            currency: { type: string }

    PaymentReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            getPaymentReport:
              type: object
              properties:
                status: { type: number }
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      invoice_number: { type: string }
                      reference_id: { type: string }
                      date: { type: string }
                      reason: { type: string }
                      adjusted_amount: { type: number }
                      transaction_status: { type: string }
                      closing_balance: { type: number }

    # ── Shared error responses ─────────────────────────────────────────────────
    Error400:
      type: object
      properties:
        error: { type: string, example: bad_request }
        message: { type: string }

    Error404:
      type: object
      properties:
        error: { type: string, example: not_found }
        message: { type: string }

    Error502:
      type: object
      properties:
        error: { type: string, example: bad_gateway }
        message: { type: string }

  # ── Shared response definitions ──────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Invalid or expired access token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: invalid_token }
              error_description: { type: string, example: "invalid/expired token" }
    BadRequest:
      description: Bad request — invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
    BadGateway:
      description: Upstream service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error502'

# ═════════════════════════════════════════════════════════════════════════════
# PATHS
# ═════════════════════════════════════════════════════════════════════════════
paths:

  # ───────────────────────────────────────────────────────────────────────────
  # AUTHENTICATION
  # Real URL: GET/POST https://stagingstores.xoxoday.com/chef/v1/oauth/token
  # ───────────────────────────────────────────────────────────────────────────

  /v1/oauth/token:
    get:
      operationId: validateToken
      summary: Validate Token
      description: >
        Validate whether the current `access_token` is still active.
        Pass the Bearer token in the `Authorization` header.
        The client application will pass the bearer token in the header.
      tags: [Authentication]
      responses:
        "200":
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The validated access token issued by Xoxoday.
                  token_type:
                    type: string
                    description: "Indicates the type of token. Always returned as `bearer`."
                  expires_in:
                    type: number
                    description: Epoch timestamp representing when the token will expire. Note — `expires_in` is in seconds.
              example:
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: bearer
                expires_in: 1718000000
        "401": { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: refreshToken
      summary: Refresh Token
      description: >
        Get the access token using the refresh token.
        Every call issues a new refresh token — the old one is immediately
        invalidated. Always store the new refresh token returned in the response.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, refresh_token, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [refresh_token]
                  description: Must be `"refresh_token"` for this API.
                refresh_token:
                  type: string
                  description: The previously issued refresh token used to obtain a new access token.
                client_id:
                  type: string
                  description: The client identifier provided by Xoxoday.
                client_secret:
                  type: string
                  description: The client secret associated with the client ID. Used to authenticate the refresh request.
            example:
              grant_type: refresh_token
              refresh_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
              client_id: "your_client_id"
              client_secret: "your_client_secret"
      responses:
        "200":
          description: New tokens issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: bearer
                expires_in: 1296000
                refresh_token: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                access_token_expiry: "1718000000000"
                refresh_token_expiry: "1720000000000"
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────────────────────────────────────────────────────
  # GIFTCARD API  (all POST to https://stagingstores.xoxoday.com/chef/v1/oauth/api)
  # ───────────────────────────────────────────────────────────────────────────

  /v1/oauth/api/giftcard/getFilters:
    post:
      operationId: giftcardGetFilters
      summary: Get Filters API
      description: >
        Filters API allows you to identify filters that are available which
        can be applied to filter the products in Get Voucher API.

        **Note:**
        1. `includeFilters` and `excludeFilters` will only work when a value is passed in `filterGroupCode`.
        2. You can pass empty values for all parameters to get a list of all available filters.

        Real URL: `POST /v1/oauth/api`
      tags: [Giftcard API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: plumProAPI.mutation.getFilters
                  description: "Please use 'plumProAPI.mutation.getFilters' always in query."
                tag:
                  type: string
                  default: plumProAPI
                  description: "Please use 'plumProAPI' always in tag."
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/FiltersData'
            example:
              query: plumProAPI.mutation.getFilters
              tag: plumProAPI
              variables:
                data:
                  filterGroupCode: Country
                  includeFilters: ""
                  excludeFilters: ""
      responses:
        "200":
          description: Filter groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiltersResponse'
              example:
                data:
                  getFilters:
                    status: 1
                    data:
                      - filterGroupName: Country
                        filterGroupDescription: ""
                        filterGroupCode: country
                        filters:
                          - filterValue: Afghanistan
                            isoCode: AF
                            filterValueCode: afghanistan
                          - filterValue: India
                            isoCode: IN
                            filterValueCode: india
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/giftcard/getVouchers:
    post:
      operationId: giftcardGetVouchers
      summary: Get Vouchers API
      description: >
        GetVouchers API enables the user to get a list of vouchers with desired
        filters available with the Xoxoday catalog.

        **Note:**
        1. To fetch `exchangeRate` pass `"exchangeRate": 1` in the request body.
        2. Use `getFilters` API to get available filter values.
        3. We recommend caching the response every time you sync the catalog.

        Real URL: `POST /v1/oauth/api`
      tags: [Giftcard API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: plumProAPI.mutation.getVouchers
                  description: "Please use 'plumProAPI.mutation.getVouchers' always in query."
                tag:
                  type: string
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/VouchersData'
            example:
              query: plumProAPI.mutation.getVouchers
              tag: plumProAPI
              variables:
                data:
                  limit: 10
                  page: 1
                  exchangeRate: 1
                  sort: { field: name, order: ASC }
                  filters:
                    - key: country
                      value: IN
      responses:
        "200":
          description: Voucher catalog returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VouchersResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/giftcard/getBalance:
    post:
      operationId: giftcardGetBalance
      summary: Get Balance API
      description: >
        Balance API allows you to fetch the available balance in your Admin wallet.

        Rather than fetching the balance before every order, use the Low Balance
        Notification option in the Admin Dashboard to receive alerts.

        Real URL: `POST /v1/oauth/api`
      tags: [Giftcard API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: plumProAPI.query.getBalance
                  description: "Please use 'plumProAPI.query.getBalance' always in query."
                tag:
                  type: string
                  default: plumProAPI
                variables:
                  type: object
                  properties:
                    data:
                      type: object
            example:
              query: plumProAPI.query.getBalance
              tag: plumProAPI
              variables:
                data: {}
      responses:
        "200":
          description: Wallet balance returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                data:
                  getBalance:
                    status: 1
                    data:
                      value: 5870.02
                      currency: INR
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/giftcard/placeOrder:
    post:
      operationId: giftcardPlaceOrder
      summary: Place Order API
      description: >
        The PlaceOrderAPI enables the client to place an order for vouchers
        available with Xoxoday.

        **Note:**
        1. A unique reference ID must be sent for every unique order in `poNumber`.
        2. Maximum order quantity for most products is 10 unless specified in `orderQuantityLimit`.
        3. If you receive a 5xx error, call `getOrderDetails` to confirm if an order exists using `poNumber` before retrying.
        4. We strongly recommend storing the request and response of every PlaceOrder call.

        Real URL: `POST /v1/oauth/api`
      tags: [Giftcard API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: plumProAPI.mutation.placeOrder
                  description: "Please use 'plumProAPI.mutation.placeOrder' always in query."
                tag:
                  type: string
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/PlaceOrderData'
            example:
              query: plumProAPI.mutation.placeOrder
              tag: plumProAPI
              variables:
                data:
                  productId: "55395"
                  quantity: "1"
                  denomination: "50"
                  poNumber: PO12662
                  email: recipient@example.com
                  contact: "+1-4705000000"
                  tag: employee_reward
                  notifyReceiverEmail: 1
                  notifyAdminEmail: 0
      responses:
        "200":
          description: Order placed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
              example:
                data:
                  placeOrder:
                    status: 1
                    data:
                      orderId: 6552967
                      orderTotal: 8.79
                      currencyCode: INR
                      amountCharged: 8.79
                      orderStatus: complete
                      deliveryStatus: delivered
                      quantity: 1
                      vouchers:
                        - productId: 55395
                          orderId: 6552967
                          voucherCode: "https://stagingstores.plum.gift/3YEyDBWOeuYnyzpD"
                          pin: ""
                          validity: "2026-08-19"
                          amount: 50
                          currency: USD
                          type: url
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/giftcard/getOrderDetails:
    post:
      operationId: giftcardGetOrderDetails
      summary: Get Order Details API
      description: >
        With the help of this endpoint you can fetch the order details of a
        specific order. Fetch by either `orderId` OR `poNumber`.

        **Note:**
        1. Do not use this API to poll order status for delayed delivery — use Webhooks instead.
        2. You can fetch order details using `poNumber` OR `orderId`.

        Real URL: `POST /v1/oauth/api`
      tags: [Giftcard API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: plumProAPI.mutation.getOrderDetails
                  description: "Please use 'plumProAPI.mutation.getOrderDetails' always in query."
                tag:
                  type: string
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/OrderDetailsData'
            example:
              query: plumProAPI.mutation.getOrderDetails
              tag: plumProAPI
              variables:
                data:
                  poNumber: PO123
                  orderId: 0
                  sendMailToReceiver: 0
      responses:
        "200":
          description: Order details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailsResponse'
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/giftcard/getOrderHistory:
    post:
      operationId: giftcardGetOrderHistory
      summary: Get Order History API
      description: >
        Allows you to fetch details of orders historically within a specified timeframe.

        Real URL: `POST /v1/oauth/api`
