  # ───────────────────────────────────────────────────────────────────────────
  # REWARD LINK API
  # ───────────────────────────────────────────────────────────────────────────

  /v1/oauth/api/links/getCampaigns:
    post:
      operationId: getCampaigns
      summary: Get Campaigns API
      description: >
        The Get Campaigns API is useful to get the list of all the campaigns
        created from the dashboard.

        Real URL: `POST /v1/oauth/api`
      tags: [Reward Link API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: xoxo_link.query.campaignList
                  description: "Please use 'xoxo_link.query.campaignList' always in query."
                tag:
                  type: string
                  default: xoxo_link
                  description: "Please use 'xoxo_link' always in tag."
                variables:
                  type: object
                  required: [add_data]
                  properties:
                    add_data:
                      type: object
                      properties:
                        limit: { type: integer, description: Number of campaigns to fetch. }
                        offset: { type: integer, description: Starting index for pagination. }
                        name: { type: string, description: Filter campaigns by name. }
                        enabled: { type: integer, enum: [0, 1], description: "1 = enabled, 0 = disabled." }
            example:
              query: xoxo_link.query.campaignList
              tag: xoxo_link
              variables:
                add_data: { limit: 10, offset: 0, name: "", enabled: 1 }
      responses:
        "200":
          description: Campaign list returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      campaignList:
                        type: object
                        properties:
                          success: { type: integer }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                campaignId: { type: integer }
                                campaignName: { type: string }
                                denomination_value: { type: number }
                                countryName: { type: string }
                                currencyCode: { type: string }
                                created_date: { type: string }
                                product_count: { type: string }
                                status: { type: integer }
                          count: { type: integer }
                          errors: { type: string, nullable: true }
              example:
                data:
                  campaignList:
                    success: 1
                    data:
                      - campaignId: 2461
                        campaignName: Test Campaign
                        denomination_value: 10
                        countryName: USA
                        currencyCode: USD
                        created_date: "0000-00-00 00:00:00"
                        product_count: "1"
                        status: 1
                    count: 1
                    errors: null
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/sendLinks:
    post:
      operationId: sendLinks
      summary: Send Link API
      description: >
        The Send Link API generates a unique reward link for an email address
        and delivers it to the user's inbox. It is ideal for automating reward
        distribution and notifications.

        **Real URL:** `POST https://canvas.xoxoday.com/chef/v1/oauth/api/sendLinks`
      tags: [Reward Link API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: xoxo_link.mutation.generateLinkEmail
                  description: "Please use 'xoxo_link.mutation.generateLinkEmail' always in query."
                tag:
                  type: string
                  default: xoxo_link
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [campaignId, email_ids, link_expiry]
                      properties:
                        campaignId: { type: string, description: Unique identifier of the campaign. }
                        email_ids: { type: string, description: Comma-separated recipient email addresses. }
                        link_expiry: { type: string, description: "Expiry date — DD-MM-YYYY format." }
            example:
              query: xoxo_link.mutation.generateLinkEmail
              tag: xoxo_link
              variables:
                data:
                  campaignId: "2455"
                  email_ids: "alice@example.com,bob@example.com"
                  link_expiry: "31-07-2026"
      responses:
        "200":
          description: Links sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generateLink:
                        type: object
                        properties:
                          success: { type: integer }
                          message: { type: string }
              example:
                data:
                  generateLink:
                    success: 1
                    message: Links created successfully
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/links/generateLinks:
    post:
      operationId: generateLinks
      summary: Generate Link API
      description: >
        The Generate Link API allows you to generate links in bulk for reward
        distribution. The API is useful for reward automation without the
        recipient's email address.

        Real URL: `POST /v1/oauth/api`
      tags: [Reward Link API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query: { type: string, default: xoxo_link.mutation.generateLink }
                tag: { type: string, default: xoxo_link }
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [campaignId, links_quantity, link_expiry]
                      properties:
                        campaignId: { type: string }
                        links_quantity: { type: integer, description: Number of links to generate. }
                        link_expiry: { type: string, description: "Expiry date — DD-MM-YYYY format." }
            example:
              query: xoxo_link.mutation.generateLink
              tag: xoxo_link
              variables:
                data: { campaignId: "2455", links_quantity: 50, link_expiry: "31-07-2026" }
      responses:
        "200":
          description: Links generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generateLink:
                        type: object
                        properties:
                          success: { type: integer }
                          message: { type: string }
                          links: { type: array, items: { type: string } }
                          batchId: { type: string }
                          campaignName: { type: string }
                          denomination_value: { type: number }
                          currencyCode: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ───────────────────────────────────────────────────────────────────────────
  # REWARD POINTS API
  # ───────────────────────────────────────────────────────────────────────────

  /v1/oauth/api/points/send:
    post:
      operationId: sendPoints
      summary: Send Points API
      description: >
        Credit reward points to one or more recipients from the Super Admin wallet.

        Real URL: `POST /v1/oauth/api`
      tags: [Reward Points API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  default: storesAdmin.mutation.sendBalance
                  description: "Please use 'storesAdmin.mutation.sendBalance' always in query."
                tag:
                  type: string
                  default: storeAdmin
                variables:
                  type: object
                  required: [recipients_data]
                  properties:
                    recipients_data:
                      type: object
                      required: [sender_email, recipients]
                      properties:
                        sender_email: { type: string, format: email, description: Super Admin email sending the points. }
                        expiry_month: { description: Points expiry in months., oneOf: [{ type: integer }, { type: string }] }
                        recipients:
                          type: array
                          items:
                            type: object
                            required: [to_email, amount]
                            properties:
                              to_name: { type: string }
                              to_email: { type: string, format: email }
                              amount: { type: string, example: "500" }
                              citation: { type: string }
            example:
              query: storesAdmin.mutation.sendBalance
              tag: storeAdmin
              variables:
                recipients_data:
                  sender_email: admin@company.com
                  recipients:
                    - to_name: Alice Smith
                      to_email: alice@example.com
                      amount: "500"
                      citation: Congratulations
      responses:
        "200":
          description: Points sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sendBalance:
                        type: object
                        properties:
                          error: { type: boolean }
                          message: { type: string }
              example:
                data:
                  sendBalance:
                    error: false
                    message: points sent
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/points/fetch:
    post:
      operationId: fetchPoints
      summary: Fetch Points API
      description: >
        This API endpoint allows you to fetch points for each user
        (which can be displayed inside your UI).

        Real URL: `POST /v1/oauth/api`
      tags: [Reward Points API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query: { type: string, default: storesAdmin.query.userBalance }
                tag: { type: string, default: storeAdmin }
                variables:
                  type: object
                  properties:
                    user_data:
                      type: object
                      properties:
                        email: { type: string, format: email, description: User's email ID to fetch balance. }
                        phone: { type: string, description: User's phone number to fetch balance. }
            example:
              query: storesAdmin.query.userBalance
              tag: storeAdmin
              variables:
                user_data:
                  email: alice@example.com
      responses:
        "200":
          description: User points balance returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_balance:
                        type: object
                        properties:
                          success: { type: integer, example: 1 }
                          message: { type: string, nullable: true }
                          data:
                            type: object
                            properties:
                              total: { type: number, description: Total available reward points. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  /v1/oauth/api/points/cancel:
    post:
      operationId: cancelPoints
      summary: Cancel Points API
      description: >
        This API allows you to cancel previously issued points for one or more
        recipients using their unique transaction identifier.

        Real URL: `POST /v1/oauth/api`
      tags: [Reward Points API]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query: { type: string, default: storesAdmin.mutation.cancelBalance }
                tag: { type: string, default: storeAdmin }
                variables:
                  type: object
                  properties:
                    recipients_data:
                      type: object
                      properties:
                        recipients:
                          type: array
                          items:
                            type: object
                            required: [unique_id]
                            properties:
                              unique_id: { type: integer, description: Unique transaction ID to cancel. }
            example:
              query: storesAdmin.mutation.cancelBalance
              tag: storeAdmin
              variables:
                recipients_data:
                  recipients:
                    - unique_id: 987654321
      responses:
        "200":
          description: Cancellation result returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cancelBalance:
                        type: object
                        properties:
                          error: { type: boolean }
                          message: { type: string }
                          recipients:
                            type: array
                            items:
                              type: object
                              properties:
                                unique_id: { type: integer }
                                success: { type: boolean }
                                message: { type: string }
        "400": { $ref: '#/components/responses/BadRequest' }
        "404": { $ref: '#/components/responses/NotFound' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ───────────────────────────────────────────────────────────────────────────
  # STOREFRONT INTEGRATION API
  # ───────────────────────────────────────────────────────────────────────────

  /v1/oauth/redirect/stores/{ssoToken}:
    get:
      operationId: ssoRedirect
      summary: SSO Storefront Redirect
      description: >
        Redirect the end-user's browser to the Xoxoday hosted StoreFront.
        The `ssoToken` is obtained from the SSO Redirection API response.

        - **Staging:** `https://stagingstores.xoxoday.com/chef/v1/oauth/redirect/stores/{ssoToken}`
        - **Production:** `https://stores.xoxoday.com/chef/v1/oauth/redirect/stores/{ssoToken}`
      tags: [Storefront Integration API]
      security: []
      parameters:
        - name: ssoToken
          in: path
          required: true
          schema: { type: string }
          description: Token returned from the SSO Redirection API. Valid for 14 days.
      responses:
        "302":
          description: Redirect to authenticated Xoxoday StoreFront session.
        "401":
          description: Invalid or expired SSO token.
