openapi: 3.0.3

info:
  title: Xoxoday Rewards API – Lounge
  version: "1.2"
  description: |
    Lounge API endpoints for browsing the lounge catalog, placing orders, and reporting.

    All operations dispatch to `POST /v1/oauth/api`. Virtual path suffixes are used
    for playground differentiation since OpenAPI does not allow multiple POST operations
    on the same path.

    **Host split:**
    - `getFilters`, `getBalance`, `paymentHistory` → `stagingstores.xoxoday.com`
    - `getLoungesCatalog`, `placeOrder`, `getOrderDetails`, `getOrderHistory` → `accounts.xoxoday.com`

    **Get Balance** sends parameters as URL query string (not request body).

servers:
  - url: https://stagingstores.xoxoday.com/chef/v1/oauth/api
    description: Sandbox

security:
  - BearerAuth: []

tags:
  - name: Catalog
  - name: Orders
  - name: Reporting

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <access_token>`"

  schemas:
    OrderHistoryItem:
      type: object
      properties:
        orderId: { type: number }
        orderDate: { type: string }
        email: { type: string }
        deliveryStatus: { type: string }
        poNumber: { type: string }
        tag: { type: string, nullable: true }
        orderTotal: { type: number }
        rawOrderTotal: { type: number, nullable: true }
        orderDiscount: { type: number }
        rawOrderDiscount: { type: number, nullable: true }
        discountPercent: { type: number }
        amountCharged: { type: number }
        currencyValue: { type: number }
        currencyCode: { type: string }
        products:
          type: array
          items:
            type: object
            properties:
              productId: { type: number }
              productName: { type: string }
              receiverMobileNumber: { type: string }
              receiverEmail: { type: string }
              price: { type: number }
              quantity: { type: number }
              orderProductStatus: { type: string }
              currency: { type: string }
        voucherDetails:
          type: array
          items:
            type: object
            properties:
              orderId: { type: number }
              productId: { type: number }
              productName: { type: string }
              currencyCode: { type: string }
              productStatus: { type: string }
              denomination: { type: number }

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Unauthorized }
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    BadGateway:
      description: Upstream service error.

paths:

  # ── Get Filters API ───────────────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api
  # Note: variables are flat (no data wrapper) unlike other endpoints.

  /getFilters:
    post:
      operationId: loungeGetFilters
      summary: Get Filter API
      description: >
        Retrieve available filters for the lounge catalog. Pass empty values to
        get all filters. `includeFilters` and `excludeFilters` only take effect
        when `filterGroupCode` is also provided.


        **Note:** `variables` fields are passed flat — no `data` wrapper.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getFilters]
                  default: plumProAPI.mutation.getFilters
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  properties:
                    filterGroupCode:
                      type: string
                      description: "Filter category (e.g. `Country`, `price`, `currency`, `lounge`)."
                      example: Country
                    includeFilters:
                      type: string
                      description: Filters to explicitly include.
                      example: usa
                    excludeFilters:
                      type: string
                      description: Filters to explicitly exclude.
                      example: uae
            example:
              query: plumProAPI.mutation.getFilters
              tag: plumProAPI
              variables:
                filterGroupCode: Country
                includeFilters: usa
                excludeFilters: uae
      responses:
        "200":
          description: Filter list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getFilters:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                filterGroupName: { type: string }
                                filterGroupDescription: { type: string }
                                filterGroupCode: { type: string }
                                filters:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      filterValue: { type: string }
                                      isoCode: { type: string }
                                      filterValueCode: { type: string }
              example:
                data:
                  getFilters:
                    status: 1
                    data:
                      - filterGroupName: Country
                        filterGroupDescription: Filter by country
                        filterGroupCode: country
                        filters:
                          - filterValue: United States
                            isoCode: US
                            filterValueCode: usa
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Balance API ───────────────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api
  # Params sent as URL query string, not request body.

  /getBalance:
    post:
      operationId: loungeGetBalance
      summary: Get Balance API
      description: >
        Fetch the available balance in your Admin wallet.
        Parameters are passed as **URL query string** for this endpoint,
        not as a JSON body.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            enum: [plumProAPI.query.getBalance]
            default: plumProAPI.query.getBalance
          description: "Always use `plumProAPI.query.getBalance`."
        - name: tag
          in: query
          required: true
          schema:
            type: string
            enum: [plumProAPI]
            default: plumProAPI
          description: "Always use `plumProAPI`."
        - name: variables
          in: query
          required: true
          schema:
            type: string
            default: '{"data":{}}'
          description: URL-encoded JSON. Pass `{"data":{}}`.
      responses:
        "200":
          description: Balance fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getBalance:
                        type: object
                        properties:
                          status: { type: number, description: "`1` = success." }
                          data:
                            type: object
                            properties:
                              value: { type: number, description: Available balance. }
                              currency: { type: string, description: "Currency code (e.g. `USD`)." }
              example:
                data:
                  getBalance:
                    status: 1
                    data:
                      value: 5000
                      currency: USD
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Lounge Catalog ────────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /getLoungesCatalog:
    post:
      operationId: loungeGetCatalog
      summary: Get Lounge Catalog
      description: >
        Fetch a paginated list of available lounges across the globe.
        Must pass `"categoryType": "lounge"` in the request body.
        Pass `"exchangeRate": 1` to include FX rates in the response.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getVouchers]
                  default: plumProAPI.mutation.getVouchers
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [categoryType]
                      properties:
                        categoryType:
                          type: string
                          enum: [lounge]
                          default: lounge
                          description: Must be `"lounge"` for this endpoint.
                        limit:
                          type: integer
                          description: Number of results per page.
                          example: 10
                        page:
                          type: integer
                          description: Page number to fetch.
                          example: 1
                        includeProducts:
                          type: string
                          description: Comma-separated product IDs to include.
                          example: "23421"
                        excludeProducts:
                          type: string
                          description: Comma-separated product IDs to exclude.
                          example: "24456"
                        exchangeRate:
                          type: integer
                          description: Pass `1` to include FX exchange rates.
                          example: 1
                        sort:
                          type: object
                          properties:
                            field:
                              type: string
                              example: name
                            order:
                              type: string
                              enum: [ASC, DESC]
                              example: ASC
                        filters:
                          type: array
                          description: List of filter objects.
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              value: { type: string }
            example:
              query: plumProAPI.mutation.getVouchers
              tag: plumProAPI
              variables:
                data:
                  categoryType: lounge
                  limit: 10
                  page: 1
                  includeProducts: "23421"
                  excludeProducts: "24456"
                  exchangeRate: 1
                  sort:
                    field: name
                    order: ASC
      responses:
        "200":
          description: Lounge catalog returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getVouchers:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                productId: { type: number }
                                name: { type: string }
                                description: { type: string }
                                orderQuantityLimit: { type: number }
                                imageUrl: { type: string }
                                currencyCode: { type: string }
                                countryName: { type: string }
                                countryCode: { type: string }
                                valueType: { type: string }
                                maxValue: { type: number }
                                minValue: { type: number }
                                valueDenominations: { type: string }
                                deliveryType: { type: string }
                                usageType: { type: string }
                                fee: { type: number }
                                discount: { type: number }
                                exchangeRate: { type: number }
                                isPhoneNumberMandatory: { type: boolean }
                                isRecommended: { type: number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Place Order API ───────────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /placeOrder:
    post:
      operationId: loungePlaceOrder
      summary: Place Order API
      description: >
        Place a lounge order. A unique `poNumber` must be sent per order.
        `loungeData` is required for DragonPass/partner fulfillment.
        Max quantity is `1` per order.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.placeOrder]
                  default: plumProAPI.mutation.placeOrder
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [productId, quantity, denomination, poNumber, loungeData]
                      properties:
                        productId:
                          type: integer
                          description: Lounge product ID to order.
                          example: 15365
                        quantity:
                          type: integer
                          description: Number of lounge passes. Max `1`.
                          example: 1
                        denomination:
                          type: number
                          description: Price/denomination of the lounge product.
                          example: 20
                        email:
                          type: string
                          format: email
                          description: Customer email for order delivery/confirmation.
                          example: your.email@example.com
                        contact:
                          type: string
                          description: Customer contact number.
                          example: "+1-4705000000"
                        tag:
                          type: string
                          description: Optional tag for internal tracking.
                          example: Rewarding
                        poNumber:
                          type: string
                          description: Client-generated PO number — must be unique per order.
                          example: PO12662
                        notifyReceiverEmail:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = notify recipient via email."
                          example: 1
                        notifyAdminEmail:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = notify admin via email."
                          example: 0
                        loungeData:
                          type: object
                          required: [firstName, lastName, categoryType, flightDepartureDate]
                          description: Lounge-specific metadata required for partner fulfillment.
                          properties:
                            firstName:
                              type: string
                              description: First name of the traveler.
                              example: Kevin
                            lastName:
                              type: string
                              description: Last name of the traveler.
                              example: Hank
                            categoryType:
                              type: string
                              enum: [lounge]
                              default: lounge
                              description: Must be `"lounge"`.
                            flightDepartureDate:
                              type: string
                              description: "Traveler's flight departure date. Format: `DD-MM-YYYY`."
                              example: "23-01-2026"
            example:
              query: plumProAPI.mutation.placeOrder
              tag: plumProAPI
              variables:
                data:
                  productId: 15365
                  quantity: 1
                  denomination: 20
                  email: your.email@example.com
                  contact: "+1-4705000000"
                  tag: Rewarding
                  poNumber: PO12662
                  notifyReceiverEmail: 1
                  notifyAdminEmail: 0
                  loungeData:
                    firstName: Kevin
                    lastName: Hank
                    categoryType: lounge
                    flightDepartureDate: "23-01-2026"
      responses:
        "200":
          description: Lounge order placed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      placeOrder:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              rawOrderTotal: { type: number }
                              orderDiscount: { type: string }
                              rawOrderDiscount: { type: string }
                              discountPercent: { type: string }
                              currencyCode: { type: string }
                              currencyValue: { type: number }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              tag: { type: string }
                              quantity: { type: number }
                              vouchers: { type: array, items: { type: object } }
                              voucherDetails:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    orderId: { type: number }
                                    productId: { type: number }
                                    productName: { type: string }
                                    currencyCode: { type: string }
                                    productStatus: { type: string }
                                    denomination: { type: number }
                                    vendorLogo: { type: string }
                              orderMeta:
                                type: object
                                properties:
                                  email: { type: string }
              example:
                data:
                  placeOrder:
                    status: 1
                    data:
                      orderId: 98765432
                      orderTotal: 20
                      currencyCode: USD
                      amountCharged: 20
                      orderStatus: complete
                      deliveryStatus: pending
                      quantity: 1
                      voucherDetails:
                        - orderId: 98765432
                          productId: 15365
                          productName: "JFK Airport Lounge"
                          currencyCode: USD
                          productStatus: pending
                          denomination: 20
                          vendorLogo: "https://cdn.xoxoday.com/dragonpass.png"
                      orderMeta:
                        email: your.email@example.com
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order Details API ─────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /getOrderDetails:
    post:
      operationId: loungeGetOrderDetails
      summary: Get Order Details API
      description: >
        Fetch details for a specific lounge order using either `poNumber` or `orderId`.
        Do not use this to poll delayed order status — use webhooks instead.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderDetails]
                  default: plumProAPI.mutation.getOrderDetails
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        poNumber:
                          type: string
                          description: PO number passed at order time. Use this OR `orderId`.
                          example: PO123
                        orderId:
                          type: integer
                          nullable: true
                          description: Order ID. Pass `0` or `null` when using `poNumber`.
                          example: 123
                        sendMailToReceiver:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = resend delivery email to recipient."
                          example: 0
            example:
              query: plumProAPI.mutation.getOrderDetails
              tag: plumProAPI
              variables:
                data:
                  poNumber: PO123
                  orderId: 123
                  sendMailToReceiver: 0
      responses:
        "200":
          description: Order details returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderDetails:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              rawOrderTotal: { type: number }
                              orderDiscount: { type: string }
                              currencyCode: { type: string }
                              currencyValue: { type: number }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              tag: { type: string }
                              orderDate: { type: string }
                              deliveryDate: { type: string }
                              quantity: { type: number }
                              voucherDetails:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    orderId: { type: number }
                                    productId: { type: number }
                                    productName: { type: string }
                                    currencyCode: { type: string }
                                    productStatus: { type: string }
                                    denomination: { type: number }
                                    cancelledQuantity: { type: number }
                              orderMeta: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order History API ─────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /getOrderHistory:
    post:
      operationId: loungeGetOrderHistory
      summary: Get Order History
      description: >
        Fetch historical lounge orders within a date range.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderHistory]
                  default: plumProAPI.mutation.getOrderHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        startDate:
                          type: string
                          description: "Start date. Format: `YYYY-MM-DD`."
                          example: "2012-07-25"
                        endDate:
                          type: string
                          description: "End date. Format: `YYYY-MM-DD`."
                          example: "2012-07-28"
                        limit:
                          type: integer
                          description: Number of records per page.
                          example: 10
                        page:
                          type: integer
                          description: Page number.
                          example: 1
            example:
              query: plumProAPI.mutation.getOrderHistory
              tag: plumProAPI
              variables:
                data:
                  startDate: "2012-07-25"
                  endDate: "2012-07-28"
                  limit: 10
                  page: 1
      responses:
        "200":
          description: Order history returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderHistory:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderHistoryItem'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Payment Report API ────────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api
  # Note: uses top-level "data" key (flat), not "variables". Fields are directly
  # under "data" (not nested under "data.data" like the giftcard version).

  /paymentHistory:
    post:
      operationId: loungePaymentHistory
      summary: Get Payment Report API
      description: >
        Fetch payment/transaction history within a date range.


        **Note:** This endpoint uses a top-level `"data"` key instead of `"variables"`.
        Fields are passed directly under `data` (not nested as `data.data`).


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Reporting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, data]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.paymentHistory]
                  default: plumProAPI.mutation.paymentHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                data:
                  type: object
                  properties:
                    startDate:
                      type: string
                      description: "Start date. Format: `YYYY-MM-DD`."
                      example: "2024-01-01"
                    endDate:
                      type: string
                      description: "End date. Format: `YYYY-MM-DD`."
                      example: "2024-01-30"
                    limit:
                      type: integer
                      description: Number of entries to return.
                      example: 100
                    page:
                      type: integer
                      description: Page number for pagination.
                      example: 1
            example:
              query: plumProAPI.mutation.paymentHistory
              tag: plumProAPI
              data:
                startDate: "2024-01-01"
                endDate: "2024-01-30"
                limit: 100
                page: 1
      responses:
        "200":
          description: Payment report returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invoice_number: { type: integer, description: Unique invoice number. }
                      reference_id: { type: integer, description: Order reference ID. }
                      date: { type: string, description: Transaction date. }
                      reason: { type: string, description: "Reason (e.g. Funds added, Refunded, Brand Voucher Issued)." }
                      adjusted_amount: { type: integer, description: Amount added or deducted. }
                      closing_balance: { type: integer, description: Closing balance after the transaction. }
                      transaction_status: { type: string, description: "`Cancelled` or `Complete`." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }
