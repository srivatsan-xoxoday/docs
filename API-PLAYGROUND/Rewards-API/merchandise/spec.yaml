openapi: 3.0.3

info:
  title: Xoxoday Rewards API – Merchandise
  version: "1.2"
  description: |
    Merchandise API endpoints for browsing the catalog, placing orders, and reporting.

    All operations dispatch to `POST /v1/oauth/api`. Virtual path suffixes are used
    for playground differentiation since OpenAPI does not allow multiple POST operations
    on the same path.

    **Host split:**
    - `getFilters`, `getBalance`, `paymentHistory` → `stagingstores.xoxoday.com`
    - `getMerchandise`, `placeOrder`, `getOrderDetails`, `getOrderHistory` → `accounts.xoxoday.com`

    **Notable differences from other categories:**
    - Place Order: `productId` is a string, shipping fields are flat inside `data`
    - Get Order Details: `variables` fields are flat (no `data` wrapper)

servers:
  - url: https://stagingstores.xoxoday.com/chef/v1/oauth/api
    description: Sandbox

security:
  - BearerAuth: []

tags:
  - name: Catalog
  - name: Orders
  - name: Reporting

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <access_token>`"

  schemas:
    OrderHistoryItem:
      type: object
      properties:
        orderId: { type: number }
        orderDate: { type: string }
        email: { type: string }
        deliveryStatus: { type: string }
        poNumber: { type: string }
        tag: { type: string, nullable: true }
        orderTotal: { type: number }
        rawOrderTotal: { type: number, nullable: true }
        orderDiscount: { type: number }
        rawOrderDiscount: { type: number, nullable: true }
        discountPercent: { type: number }
        amountCharged: { type: number }
        currencyValue: { type: number }
        currencyCode: { type: string }
        products:
          type: array
          items:
            type: object
            properties:
              productId: { type: number }
              productName: { type: string }
              receiverEmail: { type: string }
              price: { type: number }
              quantity: { type: number }
              orderProductStatus: { type: string }
              currency: { type: string }
              trackingId: { type: string, nullable: true }
              trackingLink: { type: string, nullable: true }
        voucherDetails:
          type: array
          items:
            type: object
            properties:
              orderId: { type: number }
              productId: { type: number }
              productName: { type: string }
              currencyCode: { type: string }
              productStatus: { type: string }
              denomination: { type: number }

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Unauthorized }
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    BadGateway:
      description: Upstream service error.

paths:

  # ── Get Filter API ────────────────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api
  # Note: variables use a "data" wrapper.

  /getFilters:
    post:
      operationId: merchandiseGetFilters
      summary: Get Filter API
      description: >
        Retrieve available filters for the merchandise catalog. Pass empty values to
        get all filters. `includeFilters` and `excludeFilters` only take effect
        when `filterGroupCode` is also provided.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getFilters]
                  default: plumProAPI.mutation.getFilters
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        filterGroupCode:
                          type: string
                          description: "Filter category (e.g. `Country`, `price`, `currency`)."
                          example: Country
                        includeFilters:
                          type: string
                          description: Filters to explicitly include.
                          example: usa
                        excludeFilters:
                          type: string
                          description: Filters to explicitly exclude.
                          example: uae
            example:
              query: plumProAPI.mutation.getFilters
              tag: plumProAPI
              variables:
                data:
                  filterGroupCode: Country
                  includeFilters: usa
                  excludeFilters: uae
      responses:
        "200":
          description: Filter list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getFilters:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                filterGroupName: { type: string }
                                filterGroupDescription: { type: string }
                                filterGroupCode: { type: string }
                                filters:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      filterValue: { type: string }
                                      isoCode: { type: string }
                                      filterValueCode: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Balance API ───────────────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api

  /getBalance:
    post:
      operationId: merchandiseGetBalance
      summary: Get Balance API
      description: >
        Fetch the available balance in your Admin wallet.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.query.getBalance]
                  default: plumProAPI.query.getBalance
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      description: Pass an empty object `{}`.
            example:
              query: plumProAPI.query.getBalance
              tag: plumProAPI
              variables:
                data: {}
      responses:
        "200":
          description: Balance fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getBalance:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              value: { type: number }
                              currency: { type: string }
              example:
                data:
                  getBalance:
                    status: 1
                    data:
                      value: 5000
                      currency: USD
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Merchandise API ───────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /getMerchandise:
    post:
      operationId: merchandiseGetCatalog
      summary: Get Merchandise API
      description: >
        Fetch a paginated list of available merchandise products from the catalog.
        Must pass `"categoryType": "merchandise"` in the request body.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getVouchers]
                  default: plumProAPI.mutation.getVouchers
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [categoryType]
                      properties:
                        categoryType:
                          type: string
                          enum: [merchandise]
                          default: merchandise
                          description: Must be `"merchandise"` for this endpoint.
                        limit:
                          type: integer
                          example: 10
                        page:
                          type: integer
                          example: 1
                        includeProducts:
                          type: string
                          description: Comma-separated product IDs to include.
                          example: "23353"
                        excludeProducts:
                          type: string
                          description: Comma-separated product IDs to exclude.
                          example: "1133"
                        exchangeRate:
                          type: integer
                          description: Pass `1` to include FX exchange rates.
                          example: 1
                        sort:
                          type: object
                          properties:
                            field: { type: string, example: name }
                            order: { type: string, enum: [ASC, DESC], example: ASC }
                        filters:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              value: { type: string }
            example:
              query: plumProAPI.mutation.getVouchers
              tag: plumProAPI
              variables:
                data:
                  categoryType: merchandise
                  limit: 10
                  page: 1
                  includeProducts: "23353"
                  excludeProducts: "1133"
                  exchangeRate: 1
                  sort:
                    field: name
                    order: ASC
      responses:
        "200":
          description: Merchandise catalog returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getVouchers:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                productId: { type: number }
                                name: { type: string }
                                description: { type: string }
                                orderQuantityLimit: { type: number }
                                imageUrl: { type: string }
                                currencyCode: { type: string }
                                countryName: { type: string }
                                valueType: { type: string }
                                maxValue: { type: number }
                                minValue: { type: number }
                                deliveryType: { type: string }
                                fee: { type: number }
                                discount: { type: number }
                                exchangeRate: { type: number }
                                isPhoneNumberMandatory: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Place Order API ───────────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api
  # Note: productId is a string. Shipping fields are flat inside data (not nested).

  /placeOrder:
    post:
      operationId: merchandisePlaceOrder
      summary: Place Order API
      description: >
        Place a merchandise order. A unique `poNumber` must be sent per order.
        Shipping details are required and passed as flat fields directly inside `data`.


        **Note:** `productId` is a string for this endpoint.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.placeOrder]
                  default: plumProAPI.mutation.placeOrder
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [productId, quantity, denomination, poNumber]
                      properties:
                        productId:
                          type: string
                          description: Merchandise product ID (passed as string).
                          example: "15365"
                        quantity:
                          type: integer
                          example: 1
                        denomination:
                          type: number
                          example: 20
                        email:
                          type: string
                          format: email
                          example: your.email@example.com
                        contact:
                          type: string
                          example: "+1-4705000000"
                        tag:
                          type: string
                          example: Rewarding
                        poNumber:
                          type: string
                          description: Must be unique per order.
                          example: "228291910"
                        notifyReceiverEmail:
                          type: integer
                          enum: [0, 1]
                          example: 0
                        notifyAdminEmail:
                          type: integer
                          enum: [0, 1]
                          example: 0
                        shippingFirstName:
                          type: string
                          description: Recipient first name for shipping.
                          example: John
                        shippingLastName:
                          type: string
                          description: Recipient last name for shipping.
                          example: Doe
                        shippingContactNo:
                          type: string
                          description: Recipient contact number for shipping.
                          example: "+1-234567890"
                        shippingCompany:
                          type: string
                          description: Company name for shipping label.
                          example: Acme Inc.
                        shippingAddress1:
                          type: string
                          description: Primary shipping address line.
                          example: 123 Main St
                        shippingAddress2:
                          type: string
                          description: Secondary shipping address line.
                          example: Suite 400
                        shippingCity:
                          type: string
                          example: New York
                        shippingCountry:
                          type: string
                          example: USA
                        shippingState:
                          type: string
                          example: NY
                        shippingPostcode:
                          type: string
                          example: "10001"
            example:
              query: plumProAPI.mutation.placeOrder
              tag: plumProAPI
              variables:
                data:
                  productId: "15365"
                  quantity: 1
                  denomination: 20
                  email: your.email@example.com
                  contact: "+1-4705000000"
                  tag: Rewarding
                  poNumber: "228291910"
                  notifyReceiverEmail: 0
                  notifyAdminEmail: 0
                  shippingFirstName: John
                  shippingLastName: Doe
                  shippingContactNo: "+1-234567890"
                  shippingCompany: Acme Inc.
                  shippingAddress1: 123 Main St
                  shippingAddress2: Suite 400
                  shippingCity: New York
                  shippingCountry: USA
                  shippingState: NY
                  shippingPostcode: "10001"
      responses:
        "200":
          description: Merchandise order placed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      placeOrder:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              currencyCode: { type: string }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              quantity: { type: number }
                              voucherDetails:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    orderId: { type: number }
                                    productId: { type: number }
                                    productName: { type: string }
                                    currencyCode: { type: string }
                                    productStatus: { type: string }
                                    denomination: { type: number }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order Details API ─────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api
  # Note: variables are flat — no "data" wrapper.

  /getOrderDetails:
    post:
      operationId: merchandiseGetOrderDetails
      summary: Get Order Details API
      description: >
        Fetch details for a specific merchandise order using either `poNumber` or `orderId`.


        **Note:** `variables` fields are flat — no `data` wrapper for this endpoint.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderDetails]
                  default: plumProAPI.mutation.getOrderDetails
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  properties:
                    poNumber:
                      type: string
                      description: PO number passed at order time. Use this OR `orderId`.
                      example: PO123
                    orderId:
                      type: integer
                      nullable: true
                      description: Order ID. Pass `0` or `null` when using `poNumber`.
                      example: 123
                    sendMailToReceiver:
                      type: integer
                      enum: [0, 1]
                      description: "`1` = resend delivery email to recipient."
                      example: 0
            example:
              query: plumProAPI.mutation.getOrderDetails
              tag: plumProAPI
              variables:
                poNumber: PO123
                orderId: 123
                sendMailToReceiver: 0
      responses:
        "200":
          description: Order details returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderDetails:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              currencyCode: { type: string }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              orderDate: { type: string }
                              quantity: { type: number }
                              shippingDetails:
                                type: object
                                properties:
                                  shippingFirstName: { type: string }
                                  shippingLastName: { type: string }
                                  shippingContactNo: { type: string }
                                  shippingCompany: { type: string }
                                  shippingAddress1: { type: string }
                                  shippingAddress2: { type: string }
                                  shippingCity: { type: string }
                                  shippingState: { type: string }
                                  shippingCountry: { type: string }
                                  shippingPostcode: { type: string }
                              voucherDetails:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    orderId: { type: number }
                                    productId: { type: number }
                                    productName: { type: string }
                                    currencyCode: { type: string }
                                    productStatus: { type: string }
                                    denomination: { type: number }
                                    cancelledQuantity: { type: number }
                                    trackingId: { type: string, nullable: true }
                                    trackingLink: { type: string, nullable: true }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order History API ─────────────────────────────────────────────────────
  # Real URL: POST https://accounts.xoxoday.com/chef/v1/oauth/api

  /getOrderHistory:
    post:
      operationId: merchandiseGetOrderHistory
      summary: Get Order History API
      description: >
        Fetch historical merchandise orders within a date range.


        **Real URL:** `POST https://accounts.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      servers:
        - url: https://accounts.xoxoday.com/chef/v1/oauth/api
          description: Production
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderHistory]
                  default: plumProAPI.mutation.getOrderHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        startDate:
                          type: string
                          description: "Start date. Format: `YYYY-MM-DD`."
                          example: "2012-07-25"
                        endDate:
                          type: string
                          description: "End date. Format: `YYYY-MM-DD`."
                          example: "2012-07-28"
                        limit:
                          type: integer
                          example: 10
                        page:
                          type: integer
                          example: 1
            example:
              query: plumProAPI.mutation.getOrderHistory
              tag: plumProAPI
              variables:
                data:
                  startDate: "2012-07-25"
                  endDate: "2012-07-28"
                  limit: 10
                  page: 1
      responses:
        "200":
          description: Order history returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderHistory:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderHistoryItem'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Payment Reports API ───────────────────────────────────────────────────
  # Real URL: POST https://stagingstores.xoxoday.com/chef/v1/oauth/api
  # Uses top-level "data" key (flat) — not "variables".

  /paymentHistory:
    post:
      operationId: merchandisePaymentHistory
      summary: Get Payment Reports API
      description: >
        Fetch payment/transaction history within a date range.


        **Note:** Uses a top-level `"data"` key instead of `"variables"`.
        Fields are passed directly under `data`.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Reporting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, data]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.paymentHistory]
                  default: plumProAPI.mutation.paymentHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                data:
                  type: object
                  properties:
                    startDate:
                      type: string
                      description: "Start date. Format: `YYYY-MM-DD`."
                      example: "2024-01-01"
                    endDate:
                      type: string
                      description: "End date. Format: `YYYY-MM-DD`."
                      example: "2024-01-30"
                    limit:
                      type: integer
                      example: 100
                    page:
                      type: integer
                      example: 1
            example:
              query: plumProAPI.mutation.paymentHistory
              tag: plumProAPI
              data:
                startDate: "2024-01-01"
                endDate: "2024-01-30"
                limit: 100
                page: 1
      responses:
        "200":
          description: Payment report returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invoice_number: { type: integer }
                      reference_id: { type: integer }
                      date: { type: string }
                      reason: { type: string }
                      adjusted_amount: { type: integer }
                      closing_balance: { type: integer }
                      transaction_status: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }
