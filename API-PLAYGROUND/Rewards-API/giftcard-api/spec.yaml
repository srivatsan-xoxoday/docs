openapi: 3.0.3

info:
  title: Xoxoday Rewards API – Giftcard
  version: "1.2"
  description: |
    Giftcard API endpoints for browsing the catalog, placing orders, and reporting.

    All operations dispatch to `POST /v1/oauth/api` on the real server. OpenAPI does
    not allow multiple POST operations on the same path, so each operation uses a
    short virtual path suffix under the default server for playground differentiation.

    **Real URL for all operations:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`

servers:
  - url: https://stagingstores.xoxoday.com/chef/v1/oauth/api
    description: Sandbox
  - url: https://accounts.xoxoday.com/chef/v1/oauth/api
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Catalog
  - name: Orders
  - name: Reporting

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer <access_token>`"

  schemas:
    PlumProBase:
      type: object
      required: [query, tag, variables]
      properties:
        query:
          type: string
          description: Operation selector — use the exact value shown per endpoint.
        tag:
          type: string
          enum: [plumProAPI]
          default: plumProAPI
          description: Always `plumProAPI`.
        variables:
          type: object
          required: [data]
          properties:
            data:
              type: object

    OrderHistoryItem:
      type: object
      properties:
        orderId: { type: number }
        orderDate: { type: string }
        email: { type: string }
        deliveryStatus: { type: string }
        poNumber: { type: string }
        tag: { type: string, nullable: true }
        orderTotal: { type: number }
        rawOrderTotal: { type: number, nullable: true }
        orderDiscount: { type: number }
        rawOrderDiscount: { type: number, nullable: true }
        discountPercent: { type: number }
        amountCharged: { type: number }
        currencyValue: { type: number }
        currencyCode: { type: string }
        products:
          type: array
          items:
            type: object
            properties:
              productId: { type: number }
              productName: { type: string }
              receiverMobileNumber: { type: string }
              receiverEmail: { type: string }
              price: { type: number }
              quantity: { type: number }
              orderProductStatus: { type: string }
              currency: { type: string }
        voucherDetails:
          type: array
          items:
            type: object
            properties:
              orderId: { type: number }
              productId: { type: number }
              productName: { type: string }
              currencyCode: { type: string }
              productStatus: { type: string }
              denomination: { type: number }

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Unauthorized }
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    BadGateway:
      description: Upstream service error.

paths:

  # ── Get Balance API ───────────────────────────────────────────────────────────

  /getBalance:
    post:
      operationId: giftcardGetBalance
      summary: Get Balance API
      description: >
        Fetch the available balance in your Admin wallet.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.query.getBalance]
                  default: plumProAPI.query.getBalance
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      description: Pass an empty object `{}`.
            example:
              query: plumProAPI.query.getBalance
              tag: plumProAPI
              variables:
                data: {}
      responses:
        "200":
          description: Balance fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getBalance:
                        type: object
                        properties:
                          status: { type: number, description: "`1` = success." }
                          data:
                            type: object
                            properties:
                              value: { type: number, description: Available balance. }
                              currency: { type: string, description: "Currency code (e.g. `USD`)." }
              example:
                data:
                  getBalance:
                    status: 1
                    data:
                      value: 5000
                      currency: USD
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Filters API ───────────────────────────────────────────────────────────

  /getFilters:
    post:
      operationId: giftcardGetFilters
      summary: Get Filters API
      description: >
        Retrieve available filters for the voucher catalog. Pass empty values to
        get all filters. `includeFilters` and `excludeFilters` only take effect
        when `filterGroupCode` is also provided.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getFilters]
                  default: plumProAPI.mutation.getFilters
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        filterGroupCode:
                          type: string
                          description: "Filter category name (e.g. `Country`, `price`, `currency`)."
                          example: Country
                        includeFilters:
                          type: string
                          description: Filters to explicitly include.
                          example: usa
                        excludeFilters:
                          type: string
                          description: Filters to explicitly exclude.
                          example: uae
            example:
              query: plumProAPI.mutation.getFilters
              tag: plumProAPI
              variables:
                data:
                  filterGroupCode: Country
                  includeFilters: usa
                  excludeFilters: uae
      responses:
        "200":
          description: Filter list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getFilters:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                filterGroupName: { type: string }
                                filterGroupDescription: { type: string }
                                filterGroupCode: { type: string }
                                filters:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      filterValue: { type: string }
                                      isoCode: { type: string }
                                      filterValueCode: { type: string }
              example:
                data:
                  getFilters:
                    status: 1
                    data:
                      - filterGroupName: Country
                        filterGroupDescription: Filter by country
                        filterGroupCode: country
                        filters:
                          - filterValue: United States
                            isoCode: US
                            filterValueCode: usa
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Vouchers API ──────────────────────────────────────────────────────────

  /getVouchers:
    post:
      operationId: giftcardGetVouchers
      summary: Get Vouchers API
      description: >
        Fetch a paginated list of vouchers from the Xoxoday catalog with optional
        filters and sorting. Pass `"exchangeRate": 1` to include FX rates in the response.
        Cache this response in your database and refresh periodically.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getVouchers]
                  default: plumProAPI.mutation.getVouchers
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        limit:
                          type: integer
                          description: Number of results per page.
                          example: 10
                        page:
                          type: integer
                          description: Page number to fetch.
                          example: 1
                        includeProducts:
                          type: string
                          description: Comma-separated product IDs to include.
                          example: "12345"
                        excludeProducts:
                          type: string
                          description: Comma-separated product IDs to exclude.
                          example: "54623"
                        exchangeRate:
                          type: integer
                          description: Pass `1` to include FX exchange rates in the response.
                          example: 1
                        sort:
                          type: object
                          properties:
                            field:
                              type: string
                              description: Field to sort by.
                              example: name
                            order:
                              type: string
                              enum: [ASC, DESC]
                              example: ASC
                        filters:
                          type: array
                          description: List of filter objects.
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: "Filter key (e.g. `country`, `currency`, `minPrice`)."
                              value:
                                type: string
                                description: Filter value.
            example:
              query: plumProAPI.mutation.getVouchers
              tag: plumProAPI
              variables:
                data:
                  limit: 10
                  page: 1
                  includeProducts: "12345"
                  excludeProducts: "54623"
                  exchangeRate: 1
                  sort:
                    field: name
                    order: ASC
      responses:
        "200":
          description: Voucher catalog returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getVouchers:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              type: object
                              properties:
                                productId: { type: number }
                                name: { type: string }
                                description: { type: string }
                                orderQuantityLimit: { type: number }
                                imageUrl: { type: string }
                                currencyCode: { type: string }
                                countryName: { type: string }
                                countryCode: { type: string }
                                valueType: { type: string }
                                maxValue: { type: number }
                                minValue: { type: number }
                                valueDenominations: { type: string }
                                deliveryType: { type: string }
                                usageType: { type: string }
                                fee: { type: number }
                                discount: { type: number }
                                exchangeRate: { type: number }
                                isPhoneNumberMandatory: { type: boolean }
                                isRecommended: { type: number }
                                is_free: { type: number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Place Order API ───────────────────────────────────────────────────────────

  /placeOrder:
    post:
      operationId: giftcardPlaceOrder
      summary: Place Order API
      description: >
        Place an order for a voucher. A unique `poNumber` must be sent for every
        unique order to prevent duplicates. Maximum response time for realtime
        products is 120 seconds. If you receive a 5xx error, call Get Order Details
        with the `poNumber` to check if an order was created before retrying.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.placeOrder]
                  default: plumProAPI.mutation.placeOrder
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [productId, quantity, denomination, poNumber]
                      properties:
                        productId:
                          type: integer
                          description: Unique ID of the product to order.
                          example: 15365
                        quantity:
                          type: integer
                          description: Number of units to order. Max 10 for most products.
                          example: 1
                        denomination:
                          type: number
                          description: Value/amount of the voucher.
                          example: 20
                        email:
                          type: string
                          format: email
                          description: Recipient's email address.
                          example: your.email@example.com
                        contact:
                          type: string
                          description: Recipient's contact number.
                          example: "+1-4705000000"
                        tag:
                          type: string
                          description: Custom tag to identify or categorize the order.
                          example: Rewarding
                        poNumber:
                          type: string
                          description: Purchase Order number — must be unique per order.
                          example: PO12662
                        notifyReceiverEmail:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = notify recipient via email."
                          example: 0
                        notifyAdminEmail:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = notify admin via email."
                          example: 0
            example:
              query: plumProAPI.mutation.placeOrder
              tag: plumProAPI
              variables:
                data:
                  productId: 15365
                  quantity: 1
                  denomination: 20
                  email: your.email@example.com
                  contact: "+1-4705000000"
                  tag: Rewarding
                  poNumber: PO12662
                  notifyReceiverEmail: 0
                  notifyAdminEmail: 0
      responses:
        "200":
          description: Order placed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      placeOrder:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              orderDiscount: { type: string }
                              discountPercent: { type: string }
                              currencyCode: { type: string }
                              currencyValue: { type: number }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              tag: { type: string }
                              quantity: { type: number }
                              vouchers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    productId: { type: number }
                                    orderId: { type: number }
                                    voucherCode: { type: string }
                                    pin: { type: string }
                                    validity: { type: string }
                                    amount: { type: number }
                                    currency: { type: string }
                                    country: { type: string }
                                    type: { type: string }
              example:
                data:
                  placeOrder:
                    status: 1
                    data:
                      orderId: 98765432
                      orderTotal: 20
                      currencyCode: USD
                      amountCharged: 20
                      orderStatus: complete
                      deliveryStatus: delivered
                      quantity: 1
                      vouchers:
                        - productId: 15365
                          orderId: 98765432
                          voucherCode: ABCD-1234-EFGH
                          pin: "9876"
                          validity: "2027-12-31"
                          amount: 20
                          currency: USD
                          country: US
                          type: codePin
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order Details API ─────────────────────────────────────────────────────

  /getOrderDetails:
    post:
      operationId: giftcardGetOrderDetails
      summary: Get Order Details API
      description: >
        Fetch details for a specific order using either `poNumber` or `orderId`.
        Do not use this to poll delayed order status — use webhooks instead.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderDetails]
                  default: plumProAPI.mutation.getOrderDetails
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        poNumber:
                          type: string
                          description: PO number passed at order time. Use this OR `orderId`.
                          example: PO123
                        orderId:
                          type: integer
                          nullable: true
                          description: Order ID. Pass `0` or `null` when using `poNumber`.
                          example: 123
                        sendMailToReceiver:
                          type: integer
                          enum: [0, 1]
                          description: "`1` = resend delivery email to recipient."
                          example: 0
            example:
              query: plumProAPI.mutation.getOrderDetails
              tag: plumProAPI
              variables:
                data:
                  poNumber: PO123
                  orderId: 123
                  sendMailToReceiver: 0
      responses:
        "200":
          description: Order details returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderDetails:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: object
                            properties:
                              orderId: { type: number }
                              orderTotal: { type: number }
                              rawOrderTotal: { type: number }
                              orderDiscount: { type: string }
                              currencyCode: { type: string }
                              currencyValue: { type: number }
                              amountCharged: { type: number }
                              orderStatus: { type: string }
                              deliveryStatus: { type: string }
                              tag: { type: string }
                              orderDate: { type: string }
                              deliveryDate: { type: string }
                              quantity: { type: number }
                              vouchers:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    productId: { type: number }
                                    voucherCode: { type: string }
                                    pin: { type: string }
                                    validity: { type: string }
                                    amount: { type: number }
                                    currency: { type: string }
                              voucherDetails:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    orderId: { type: number }
                                    productId: { type: number }
                                    productName: { type: string }
                                    currencyCode: { type: string }
                                    productStatus: { type: string }
                                    denomination: { type: number }
                                    cancelledQuantity: { type: number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Order History API ─────────────────────────────────────────────────────

  /getOrderHistory:
    post:
      operationId: giftcardGetOrderHistory
      summary: Get Order History API
      description: >
        Fetch historical orders within a date range. Use a high `limit` and `page: 1`
        to retrieve all orders in the specified timeframe.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, variables]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.getOrderHistory]
                  default: plumProAPI.mutation.getOrderHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                variables:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        startDate:
                          type: string
                          description: "Start date. Format: `YYYY-MM-DD`."
                          example: "2012-07-25"
                        endDate:
                          type: string
                          description: "End date. Format: `YYYY-MM-DD`."
                          example: "2012-07-28"
                        limit:
                          type: integer
                          description: Number of records per page.
                          example: 10
                        page:
                          type: integer
                          description: Page number.
                          example: 1
                        tag:
                          type: string
                          description: Filter by custom tag.
            example:
              query: plumProAPI.mutation.getOrderHistory
              tag: plumProAPI
              variables:
                data:
                  startDate: "2012-07-25"
                  endDate: "2012-07-28"
                  limit: 10
                  page: 1
      responses:
        "200":
          description: Order history returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getOrderHistory:
                        type: object
                        properties:
                          status: { type: number }
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderHistoryItem'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }

  # ── Get Payment Report API ────────────────────────────────────────────────────
  # Note: uses "data" as the top-level key instead of "variables"

  /paymentHistory:
    post:
      operationId: giftcardPaymentHistory
      summary: Get Payment Report API
      description: >
        Fetch payment/transaction history within a date range.


        **Note:** This endpoint uses `"data"` as the top-level request key
        instead of `"variables"` — this is intentional and differs from other endpoints.


        **Real URL:** `POST https://stagingstores.xoxoday.com/chef/v1/oauth/api`
      tags: [Reporting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, tag, data]
              properties:
                query:
                  type: string
                  enum: [plumProAPI.mutation.paymentHistory]
                  default: plumProAPI.mutation.paymentHistory
                tag:
                  type: string
                  enum: [plumProAPI]
                  default: plumProAPI
                data:
                  type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      properties:
                        startDate:
                          type: string
                          description: "Start date. Format: `YYYY-MM-DD`."
                          example: "2012-07-25"
                        endDate:
                          type: string
                          description: "End date. Format: `YYYY-MM-DD`."
                          example: "2012-07-28"
                        limit:
                          type: integer
                          description: Number of entries to return.
                          example: 10
                        page:
                          type: integer
                          description: Page number for pagination.
                          example: 1
            example:
              query: plumProAPI.mutation.paymentHistory
              tag: plumProAPI
              data:
                data:
                  startDate: "2012-07-25"
                  endDate: "2012-07-28"
                  limit: 10
                  page: 1
      responses:
        "200":
          description: Payment report returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invoice_number: { type: integer, description: Unique invoice number. }
                      reference_id: { type: integer, description: Order reference ID for deductions or refunds. }
                      date: { type: string, description: Transaction date. }
                      reason: { type: string, description: "Reason (e.g. Funds added, Refunded, Brand Voucher Issued)." }
                      adjusted_amount: { type: integer, description: Amount added or deducted. }
                      closing_balance: { type: integer, description: Closing balance after the transaction. }
                      transaction_status: { type: string, description: "`Cancelled` or `Complete`." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "502": { $ref: '#/components/responses/BadGateway' }
